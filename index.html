function render(){['home','mov','cfg'].forEach((k,i)=>$('n'+(i+1)).className=tab==k?'on':'');$('a').innerHTML=tab=='home'?home():tab=='mov'?mov():cfg()}
function home(){
const tot=ACC.reduce((s,a)=>s+bal(a),0),mo=today().slice(0,7),tx=S.tx.filter(t=>per=='all'||t.d.slice(0,7)==mo),pc=Math.min(100,Math.max(0,tot/S.meta*100));
const rows=S.rubros.map(r=>{let i=0,g=0,v=0;tx.forEach(t=>{if(t.r!=r||EX.includes(t.c))return;if(t.t=='I')i+=t.m;if(t.t=='G')g+=t.m;if(t.t=='V')v+=t.m});return{r,i,g,v,n:i-g-v}}).filter(x=>x.i||x.g||x.v);
return `<h1>Mis finanzas</h1><div class="c"><div class="mu">Total que tengo</div><div class="big">${f(tot)}</div><div class="bar"><i style="width:${pc}%"></i></div><div class="mu">Meta ${f(S.meta)} · ${pc.toFixed(1)}% · faltan ${f(S.meta-tot)}</div></div>
<div class="c">${ACC.map(a=>`<div class="row"><div><b>${a}</b>${a=='General'?'<div class="mu">efectivo: leche, huevos, terneros…</div>':''}</div><div style="text-align:right"><b>${f(bal(a))}</b><br><button class="s" onclick="cuadrar('${a}')">Cuadrar</button></div></div>`).join('')}</div>
<div class="seg"><button class="${per=='all'?'on':''}" onclick="per='all';render()">Todo</button><button class="${per=='m'?'on':''}" onclick="per='m';render()">Este mes</button></div>
<div class="c tp"><b>Por rubro (filtro)</b><div class="mu">Toca uno para ver sus movimientos</div>${rows.map(x=>`<div class="row" onclick="fr='${x.r}';ftp='Todos';tab='mov';render()"><div><b>${x.r}</b><div class="mu">entró ${f(x.i)} · invertido ${f(x.v)}${x.g?' · gastos '+f(x.g):''}</div></div><b class="${x.n<0?'r':'g'}">${f(x.n)}</b></div>`).join('')||'<div class="mu">Sin datos</div>'}</div>`}
function mov(){
let l=S.tx.filter(t=>(fr=='Todos'||t.r==fr)&&(ftp=='Todos'||t.t==ftp)&&(fa=='Todas'||t.a==fa||t.b==fa)).sort((a,b)=>b.d<a.d?-1:b.d>a.d?1:b.id-a.id);
let en=0,sa=0;l.forEach(t=>{if(EX.includes(t.c))return;if(t.t=='I')en+=t.m;if(t.t=='G'||t.t=='V')sa+=t.m});
const sel=(v,o,fn)=>`<select onchange="${fn}=this.value;render()">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
return `<h1>Movimientos</h1>${sel(fr,['Todos',...S.rubros],'fr')}${sel(ftp,['Todos','I','G','V','T'],'ftp').replace(/>I</,'>I<')}${sel(fa,['Todas',...ACC],'fa')}
<div class="c"><div class="row"><span>Entró</span><b class="g">${f(en)}</b></div><div class="row"><span>Salió</span><b class="r">${f(sa)}</b></div><div class="mu">${l.length} movimientos (I=ingreso, G=gasto, V=inversión, T=transferencia)</div></div>
<div class="c">${l.map(t=>`<div class="row" onclick="openF(${t.id})"><div><b>${t.t=='T'?esc(t.a)+' → '+esc(t.b):esc(t.n||t.c||TN[t.t])}</b><div class="mu">${t.d} · ${TN[t.t]}${t.r?' · '+esc(t.r):''}${t.t!='T'?' · '+esc(t.a):''}</div></div><b class="${t.t=='I'?'g':t.t=='T'?'':'r'}">${t.t=='I'?'+':t.t=='T'?'':'−'}${f(t.m)}</b></div>`).join('')||'<div class="mu">Nada por aquí</div>'}</div>`}
function cfg(){return `<h1>Ajustes</h1>${gcfg()}<div class="c"><label>Meta de ahorro (USD)</label><input id="mt" type="number" value="${S.meta}" onchange="S.meta=+this.value||0;save()"><button class="s" onclick="addR()">+ Agregar rubro</button><button class="s" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">Claro/Oscuro</button></div>
<div class="c"><b>Respaldo</b><div class="mu">Tus datos viven en este teléfono. Copia el respaldo de vez en cuando y guárdalo en tus notas.</div><button class="s" onclick="bk()">Copiar respaldo</button><button class="s" onclick="rs()">Restaurar</button></div>`}
function addR(){const n=prompt('Nombre del nuevo rubro');if(n&&!S.rubros.includes(n.trim())){S.rubros.push(n.trim());save();render()}}
function bk(){const s=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert('Respaldo copiado')).catch(()=>prompt('Copia este texto:',s))}
function rs(){const s=prompt('Pega aquí tu respaldo');if(!s)return;try{const o=JSON.parse(s);if(!o.tx)throw 0;S=o;S.del=S.del||[];save();render()}catch(e){alert('Respaldo no válido')}}
function cuadrar(a){const v=prompt('¿Cuánto hay realmente en '+a+'?');if(v===null||v==='')return;const d=+v-bal(a);if(isNaN(d)||Math.abs(d)<.005)return;
S.tx.push({id:Date.now(),d:today(),t:d>0?'I':'G',a,r:'',c:'Ajuste',n:'Ajuste por conteo real',m:Math.abs(+d.toFixed(2))});save();render()}
function openF(id){ed=id?S.tx.find(t=>t.id==id):null;ty=ed?ed.t:'I';drawF();$('m').style.display='flex'}
function drawF(){const e=ed||{d:today(),a:'General',b:'Banco Nacional',r:S.rubros[0],c:'Venta',n:'',m:''};
const o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
$('f').innerHTML=`<div class="seg">${Object.keys(TN).map(k=>`<button class="${k==ty?'on':''}" onclick="ty='${k}';keep();drawF()">${TN[k]}</button>`).join('')}</div>
<label>Monto</label><input id="fm" type="number" inputmode="decimal" step="0.01" value="${e.m}"><label>Fecha</label><input id="fd" type="date" value="${e.d}">
<label>${ty=='I'?'Cuenta donde entró':ty=='T'?'Sale de':'Cuenta de donde salió'}</label><select id="fa">${o(ACC,e.a)}</select>
${ty=='T'?`<label>Entra a</label><select id="fb">${o(ACC,e.b)}</select>`:`<label>Rubro (filtro)</label><select id="fr">${o(S.rubros,e.r)}</select><label>Categoría</label><input id="fc" list="cl" value="${esc(e.c)}"><datalist id="cl"><option>Venta<option>Otros ingresos<option>Gasto operativo<option>Compra de activo</datalist>`}
<label>Nota</label><input id="fn" value="${esc(e.n)}"><button class="b" onclick="sv()">Guardar</button>${ed?'<button class="s" onclick="del()">Eliminar</button>':''}<button class="s" onclick="$(\'m\').style.display=\'none\'">Cancelar</button>`}
function keep(){ed=Object.assign({},ed||{},{m:$('fm').value,d:$('fd').value,a:$('fa').value,n:$('fn').value,t:ty})}
function sv(){const m=+$('fm').value;if(!(m>0)){alert('Pon un monto');return}
const t={id:ed&&ed.id||Date.now(),d:$('fd').value||today(),t:ty,a:$('fa').value,m:m,n:$('fn').value};
if(ty=='T'){t.b=$('fb').value;t.r='';t.c='Transferencia';if(t.a==t.b){alert('Elige cuentas distintas');return}}else{t.r=$('fr').value;t.c=$('fc').value}
S.tx=S.tx.filter(x=>x.id!=t.id);S.tx.push(t);save();$('m').style.display='none';ed=null;render()}
function del(){if(confirm('¿Eliminar este movimiento?')){S.del.push(ed.id);S.tx=S.tx.filter(x=>x.id!=ed.id);save();$('m').style.display='none';render()}}
idbGet('S').then(x=>{if(x&&x.tx&&(x.u||0)>(S.u||0)){S=x;S.del=S.del||[];render()}});
idbGet('C').then(c=>{if(!GH&&c){GH=c;try{localStorage.setItem('fin_gh',JSON.stringify(c))}catch(e){}}});
setTimeout(sync,800);addEventListener('online',sync);
render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
